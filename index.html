    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "midnight": "#020617",
                        "cosmic-black": "#000000",
                        "star-white": "#ffffff",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-midnight text-star-white font-sans antialiased;
                background: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 80%);
                min-height: 100vh;
                overflow-x: hidden;
            }
        }
        .glass-card {
            @apply bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .neon-text {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .geometric-grid {
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .star-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            filter: blur(0.5px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
